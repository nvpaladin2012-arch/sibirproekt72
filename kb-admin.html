<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Knowledge Base — Сибирь Проект</title>
<style>
  :root{color-scheme:dark;--bg:#070b16;--card:#111a2e;--line:#26324a;--text:#e8edf7;--muted:#94a3b8;--accent:#f5b642}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",Arial,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:40px 18px 80px}
  h1{font-size:26px;margin:0 0 6px}h2{font-size:18px;margin:0 0 14px}
  p.lead{color:var(--muted);margin:0 0 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#0b1222;color:var(--text);font:inherit}
  input[type=file]{padding:8px}
  button{margin-top:16px;border:0;border-radius:9px;background:var(--accent);color:#1a1204;font-weight:700;padding:11px 18px;cursor:pointer}
  button:hover{filter:brightness(1.07)}button.danger{background:transparent;color:#f87171;border:1px solid #7f1d1d;padding:6px 10px;margin:0}
  #msg{white-space:pre-wrap;margin-top:14px;font-size:14px;color:var(--accent)}
  ul{list-style:none;padding:0;margin:0}li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  li:last-child{border-bottom:0}small{display:block;color:var(--muted)}
  .empty{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Knowledge Base</h1>
  <p class="lead">Загрузка документов для RAG-поиска ИИ-консультанта. Доступ по токену <code>kb_admin_token</code> из <code>api/config.php</code>.</p>

  <div class="card">
    <h2>Загрузить документ</h2>
    <label for="token">Токен администратора</label>
    <input id="token" type="password" autocomplete="off" placeholder="вставьте kb_admin_token">
    <label for="title">Заголовок документа</label>
    <input id="title" type="text" placeholder="Например: Чек-лист: 12 точек перед подачей">
    <label for="url">Ссылка на источник (необязательно)</label>
    <input id="url" type="url" placeholder="https://sibirproekt72.ru/checklist.html">
    <label for="file">Файл: .txt, .md, .html или .pdf</label>
    <input id="file" type="file" accept=".txt,.md,.html,.pdf">
    <label for="textfile">Текст PDF, если сервер не извлекает его сам (.txt, необязательно)</label>
    <input id="textfile" type="file" accept=".txt">
    <button id="upload" type="button">Загрузить в базу знаний</button>
    <div id="msg"></div>
  </div>

  <div class="card">
    <h2>Документы в базе</h2>
    <button id="refresh" type="button">Обновить список</button>
    <ul id="list"><li class="empty">Список не загружен</li></ul>
  </div>
</div>

<script>
(function(){
  var tokenEl=document.getElementById('token'), msg=document.getElementById('msg'), list=document.getElementById('list');
  function token(){return tokenEl.value.trim();}
  function say(text){msg.textContent=text;}
  function authHeaders(){return {'Authorization':'Bearer '+token(),'X-KB-Token':token()};}

  async function load(){
    if(!token()){list.innerHTML='<li class="empty">Введите токен выше</li>';return;}
    try{
      var res=await fetch('api/kb.php?action=list',{headers:authHeaders()});
      var data=await res.json();
      if(!res.ok) throw new Error(data.error||('HTTP '+res.status));
      if(!data.documents.length){list.innerHTML='<li class="empty">Документов пока нет</li>';return;}
      list.innerHTML='';
      data.documents.forEach(function(d){
        var li=document.createElement('li');
        var info=document.createElement('div');
        info.innerHTML='<b></b><small></small>';
        info.querySelector('b').textContent=d.title;
        info.querySelector('small').textContent=d.name+' · '+d.size+' Б · '+d.modified;
        var del=document.createElement('button');
        del.className='danger';del.type='button';del.textContent='Удалить';
        del.addEventListener('click',async function(){
          if(!confirm('Удалить '+d.name+'?'))return;
          var r=await fetch('api/kb.php?action=delete',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({name:d.name})});
          var j=await r.json();say(j.error||('Удалено: '+d.name));load();
        });
        li.appendChild(info);li.appendChild(del);list.appendChild(li);
      });
    }catch(e){list.innerHTML='';say('Ошибка: '+e.message);}
  }

  document.getElementById('refresh').addEventListener('click',load);

  document.getElementById('upload').addEventListener('click',async function(){
    var file=document.getElementById('file').files[0];
    if(!token()||!file){say('Укажите токен и выберите файл.');return;}
    var fd=new FormData();
    fd.append('file',file);
    fd.append('title',document.getElementById('title').value.trim()||file.name);
    fd.append('url',document.getElementById('url').value.trim());
    var extra=document.getElementById('textfile').files[0];
    if(extra)fd.append('text_file',extra);
    say('Загружаю...');
    try{
      var res=await fetch('api/kb.php?action=upload',{method:'POST',headers:authHeaders(),body:fd});
      var data=await res.json();
      say(res.ok?('Готово: '+data.name+' ('+data.chars+' символов). Документ сразу доступен поиску.'):(data.error||('HTTP '+res.status)));
      load();
    }catch(e){say('Ошибка: '+e.message);}
  });

  load();
})();
</script>
</body>
</html>
